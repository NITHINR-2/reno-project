# Shared configuration. Profile-specific overrides follow below (dev, test).
spring:
  application:
    name: fleet
  config:
    # Local, git-ignored KEY=VALUE overrides (see backend/.env.example).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet}
    username: ${DB_USERNAME:fleet}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      # Schema is owned exclusively by Flyway migrations.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fleet:
  version: "@project.version@"

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

logging:
  level:
    com.renault.fleet: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  # Datasource is supplied by Testcontainers via @ServiceConnection.
  flyway:
    clean-disabled: true

logging:
  level:
    com.renault.fleet: INFO
