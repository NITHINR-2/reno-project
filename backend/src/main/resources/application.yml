# Shared configuration. Profile-specific overrides follow below (dev, test).
spring:
  application:
    name: fleet
  config:
    # Local, git-ignored KEY=VALUE overrides (see backend/.env.example).
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleet}
    username: ${DB_USERNAME:fleet}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
    hibernate:
      # Schema is owned exclusively by Flyway migrations.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mvc:
    problemdetails:
      enabled: true
  data:
    web:
      pageable:
        max-page-size: 100

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

fleet:
  version: "@project.version@"
  # Where the frontend is served; the quotation QR code links to <public-base-url>/verify/quotation/<token>.
  public-base-url: ${PUBLIC_BASE_URL:http://localhost:5173}
  public-api:
    rate-limit:
      # Requests per client address per minute on /api/public/** (quotation verification).
      per-minute: 30
  quotation:
    validity-days: 30
    # Placeholder terms; Finance owns the final wording.
    default-terms: >-
      Prices include GST at the rate shown. This quotation is valid until the date stated.
      Issuing this quotation is not a receipt of payment. Delivery follows financial clearance.
  sla:
    breach-scan:
      # Records SLA_BREACHED events; ISO-8601 durations.
      enabled: true
      interval: PT5M
      initial-delay: PT1M
  security:
    jwt:
      # HS256 signing secret, >= 32 bytes. Required; startup fails without it. Generate: openssl rand -base64 48
      secret: ${JWT_SECRET:}
      issuer: renault-fleet-portal
      access-token-ttl: 15m
      refresh-token-ttl: 7d

---
spring:
  config:
    activate:
      on-profile: dev
  jpa:
    show-sql: false

logging:
  level:
    com.renault.fleet: DEBUG

---
spring:
  config:
    activate:
      on-profile: test
  # Datasource is supplied by Testcontainers via @ServiceConnection.
  flyway:
    clean-disabled: true

fleet:
  public-base-url: http://portal.test
  public-api:
    rate-limit:
      # Low, so the 429 path is reachable in tests; each test uses its own client address.
      per-minute: 5
  sla:
    breach-scan:
      # Tests call SlaBreachJob.scan() directly; a background scan would race their assertions.
      enabled: false
  security:
    jwt:
      # Random per test run (2 x 128-bit hex), so no secret is committed.
      secret: ${random.value}${random.value}

logging:
  level:
    com.renault.fleet: INFO
